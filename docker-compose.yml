version: '3'
services:
  rag-chatbot:
    build: .
    ports:
      - "8081:5000"
    volumes:
      - ./vector_db:/app/vector_db
      - ./conversations.db:/app/conversations.db
      - ~/.ssh:/root/.ssh  # For GitHub SSH authentication
    env_file:
      - .env
    restart: unless-stopped

  data-sync-api:
    build:
      context: .
      dockerfile: Dockerfile.sync
    ports:
      - "8082:5001"
    volumes:
      - ./conversations.db:/app/conversations.db
      - ./conversation_logs:/app/conversation_logs
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - rag-chatbot