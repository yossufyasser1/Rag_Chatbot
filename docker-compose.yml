version: '3'

services:
  rag-chatbot:
    build:
      context: .
      args:
        - GITHUB_DOCS_REPO=${GITHUB_DOCS_REPO}
        - GITHUB_TOKEN=${GITHUB_TOKEN}  # For private repositories
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL_NAME=models/gemini-2.0-flash
    volumes:
      - vector_db_data:/app/vector_db
      - conversation_logs:/app/conversation_logs
    restart: unless-stopped

volumes:
  vector_db_data:
  conversation_logs: